# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float on, match:class ^(rofi)
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)
windowrule = float on, match:class ^()$, match:title ^(Picture in picture)$
windowrule = float on, match:class ^()$, match:title ^(Save File)$
windowrule = float on, match:class ^()$, match:title ^(Open File)$
windowrule = float on, match:class ^(LibreWolf)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float on, match:class ^(CachyOSHello)$
windowrule = float on, match:class ^(zenity)$
windowrule = float on, match:class ^()$, match:title ^(Steam - Self Updater)$
# Keep the Hyprland screen-share source picker compact and centered.
windowrule = float on, match:class ^(hyprland-share-picker)$
windowrule = size 960 540, match:class ^(hyprland-share-picker)$
windowrule = center on, match:class ^(hyprland-share-picker)$
# General window rules
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 960 540, match:title ^(Picture-in-Picture)$
windowrule = move 25%- 25%-, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = move 25%- 25%-, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = size 960 540, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = pin on, match:title ^(danmufloat)$
windowrule = rounding 5, match:title ^(danmufloat|termfloat)$
# windowrule = animation slide right, match:class ^(kitty|Alacritty)$
windowrule = no_blur on, match:class ^(zen)$
windowrule = no_blur on, match:class ^(equibop)$
windowrule = opacity 0.85 0.85, match:class ^(obsidian)$
# Decorations related to floating windows on workspaces 1 to 10
windowrule = border_size 2, match:float 1, match:workspace w[fv1-10]
windowrule = border_color $cachylblue, match:float 1, match:workspace w[fv1-10]
windowrule = rounding 8, match:float 1, match:workspace w[fv1-10]
# Decorations related to tiling windows on workspaces 1 to 10
windowrule = border_size 3, match:float 0, match:workspace f[1-10]
windowrule = rounding 4, match:float 0, match:workspace f[1-10]
windowrule = opacity 0.999 0.999, match:class ^(virt-manager)$
windowrule = opacity 0.999 0.999, match:class ^(virt-viewer)$
windowrule = stay_focused on, match:class zoom, match:title menu window
windowrule = no_blur on, match:class zoom
windowrule = no_blur on, match:title as_toolbar

# Prajols workflow rules
# windowrule = workspace 1, match:class ^(zen)$ # put zen in browser workspace
# windowrule = workspace 2, match:class ^(neovide)$ # put neovide in code workspace
# windowrule = workspace 3, match:class ^(equibop)$
# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/ #
workspace = 1, defaultName: 󰖟   browser, persistent:true
workspace = 2, defaultName:    code, persistent:true
workspace = 3, defaultName:    discord, persistent:true
workspace = 4, defaultName: ♫   music, persistent:true

# Workspace selectors https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#workspace-selectors
workspace = r[1-5], monitor:$priMon
workspace = special:scratchpad, on-created-empty:$applauncher
# no_gaps_when_only deprecated instead workspaces rules with selectors can do the same
# Smart gaps from 0.45.0 https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]
# Workspaces Rules End #

# Layers Rules #
layerrule = animation slide top, match:namespace logout_dialog
# layerrule = animation popin 50%, match:namespace waybar
layerrule = animation slide down, match:namespace waybar
layerrule = animation fade 50%, match:namespace wallpaper
# Layers Rules End #

# Game rules
windowrule = immediate on, match:class ^(com\.mojang\.minecraft)$
windowrule = immediate on, match:title ^(Minecraft.*|CMCLIENT.*|CMClient.*)$
windowrule = immediate on, match:class ^(crankshaft)$

#waydroid xtmapper
# Waydroid
windowrule = float on, match:class Waydroid
windowrule = size 1920 1080, match:class Waydroid
windowrule = center on, match:class Waydroid
windowrule = fullscreen on, match:class Waydroid

# XtMapper (overlay)
windowrule = float on, match:title ^XtMapper$
windowrule = border_size 0, match:title ^XtMapper$
windowrule = pin on, match:title ^XtMapper$

# Layer Rules (applies to the layer surface)
layerrule = blur on, match:namespace rofi
layerrule = animation none, match:namespace rofi      
layerrule = animation none, match:namespace waybar
